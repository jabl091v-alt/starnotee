<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarNote 🌌</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
/* 🌌 خلفية فضاء متحرك */
body {
    margin: 0;
    font-family: Arial;
    color: white;
    overflow: hidden;
    background: black;
}

/* نجوم الخلفية */
.stars-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    z-index: -1;
}

.star-bg {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.6;
    animation: moveStars linear infinite;
}

@keyframes moveStars {
    from { transform: translateY(0); }
    to { transform: translateY(100vh); }
}

/* 🌌 واجهة */
.container {
    text-align: center;
    margin-top: 20px;
}

/* ✨ بوكس زجاجي */
textarea {
    width: 80%;
    height: 100px;
    border-radius: 15px;
    border: none;
    padding: 15px;
    outline: none;
    font-size: 16px;
    background: rgba(255,255,255,0.1);
    color: white;
    backdrop-filter: blur(10px);
}

button {
    margin-top: 10px;
    padding: 10px 25px;
    border: none;
    border-radius: 10px;
    background: gold;
    font-weight: bold;
    cursor: pointer;
}

/* ⭐ نجوم الرسائل */
.star {
    position: absolute;
    font-size: 24px;
    cursor: pointer;
    animation: floatStar 6s infinite ease-in-out;
}

@keyframes floatStar {
    0% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0); }
}

/* 💫 نافذة العرض */
.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
}

.popup-content {
    background: rgba(20,20,20,0.9);
    padding: 20px;
    width: 80%;
    margin: 30% auto;
    border-radius: 15px;
    backdrop-filter: blur(10px);
}
</style>
</head>

<body>

<div class="stars-bg" id="bg"></div>

<div class="container">
    <h1>⭐ StarNote</h1>
    <textarea id="note" placeholder="اكتب ملاحظتك..."></textarea><br>
    <button onclick="saveNote()">إرسال</button>
</div>

<div id="stars"></div>

<div id="popup" class="popup">
    <div class="popup-content">
        <p id="popupText"></p>
        <small id="popupTime"></small><br><br>
        <button onclick="closePopup()">إغلاق</button>
    </div>
</div>

<script>
// 🌌 خلفية نجوم متحركة
for (let i = 0; i < 80; i++) {
    let s = document.createElement("div");
    s.className = "star-bg";
    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";
    s.style.animationDuration = (5 + Math.random()*10) + "s";
    document.getElementById("bg").appendChild(s);
}

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyC4bSu52LkoUTTOY2_P3q7sQSkrus3NccA",
  authDomain: "starnote-52dab.firebaseapp.com",
  projectId: "starnote-52dab",
  storageBucket: "starnote-52dab.firebasestorage.app",
  messagingSenderId: "701812553416",
  appId: "1:701812553416:web:328c463b159a5d788617fd"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// حفظ
function saveNote() {
    let text = document.getElementById("note").value;
    if (!text) return;

    db.collection("notes").add({
        text: text,
        time: new Date().toLocaleString()
    });

    document.getElementById("note").value = "";
}

// عرض النجوم بشكل عشوائي بالفضاء
db.collection("notes").orderBy("time","desc")
.onSnapshot(snapshot => {
    let box = document.getElementById("stars");
    box.innerHTML = "";

    snapshot.forEach(doc => {
        let data = doc.data();

        let star = document.createElement("div");
        star.className = "star";

        star.style.left = Math.random()*90 + "%";
        star.style.top = Math.random()*80 + "%";

        star.innerHTML = "⭐";

        star.onclick = () => openStar(data.text, data.time);

        box.appendChild(star);
    });
});
    // popup
function openStar(text, time){
    document.getElementById("popup").style.display = "block";
    document.getElementById("popupText").innerText = "⭐ " + text;
    document.getElementById("popupTime").innerText = "📅 " + time;
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
