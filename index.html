<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarNote 🌌</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #000010, #000000);
    color: white;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin-top: 20px;
    color: gold;
    text-shadow: 0 0 10px gold;
}

textarea {
    width: 80%;
    height: 100px;
    margin-top: 10px;
    border-radius: 10px;
    padding: 10px;
    border: none;
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    background: gold;
    color: black;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
}

/* 🌟 النجوم */
.star {
    display: inline-block;
    font-size: 28px;
    margin: 10px;
    cursor: pointer;
    animation: float 6s infinite ease-in-out;
    transition: transform 0.3s;
}

.star:hover {
    transform: scale(1.4);
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
}

/* 🌌 popup */
.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
}

.popup-content {
    background: #111;
    color: white;
    padding: 20px;
    margin: 25% auto;
    width: 80%;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>⭐ StarNote</h1>
<p>اكتب رسالة وخليها نجمة بالفضاء 🌌</p>

<textarea id="note"></textarea><br>
<button onclick="saveNote()">إرسال</button>

<div id="stars"></div>

<!-- Popup -->
<div id="popup" class="popup">
    <div class="popup-content">
        <p id="popupText"></p>
        <small id="popupTime"></small>
        <br><br>
        <button onclick="closePopup()">إغلاق</button>
    </div>
</div>

<script>
// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyC4bSu52LkoUTTOY2_P3q7sQSkrus3NccA",
  authDomain: "starnote-52dab.firebaseapp.com",
  projectId: "starnote-52dab",
  storageBucket: "starnote-52dab.firebasestorage.app",
  messagingSenderId: "701812553416",
  appId: "1:701812553416:web:328c463b159a5d788617fd"
};

// init
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 💾 حفظ الرسالة
function saveNote() {
    let text = document.getElementById("note").value;

    if (text === "") return alert("اكتب رسالة!");

    db.collection("notes").add({
        text: text,
        time: new Date().toLocaleString()
    });

    document.getElementById("note").value = "";
}

// 🌌 عرض النجوم
db.collection("notes").orderBy("time", "desc")
.onSnapshot(snapshot => {
    let box = document.getElementById("stars");
    box.innerHTML = "";

    snapshot.forEach(doc => {
        let data = doc.data();

        box.innerHTML += `
            <div class="star" onclick="openStar('${data.text}','${data.time}')">
                ⭐
            </div>
        `;
    });
});

// 👆 فتح النجمة
function openStar(text, time) {
    document.getElementById("popup").style.display = "block";
    document.getElementById("popupText").innerText = "⭐ " + text;
    document.getElementById("popupTime").innerText = "📅 " + time;
}

// ❌ إغلاق
function closePopup() {
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
