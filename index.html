<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarNote 🌌</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
}

.ui {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

textarea {
    width: 60%;
    height: 80px;
    border-radius: 12px;
    border: none;
    padding: 10px;
    background: rgba(255,255,255,0.1);
    color: white;
}

button {
    padding: 10px 20px;
    margin-top: 5px;
    border: none;
    background: gold;
    border-radius: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="ui">
    <h2 style="color:white">⭐ StarNote Test Galaxy</h2>
    <textarea placeholder="رسالة تجريبية"></textarea><br>
    <button>إرسال (تجريبي)</button>
</div>

<script>
// canvas
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
    c.width = window.innerWidth;
    c.height = window.innerHeight;
}
resize();
window.onresize = resize;

// ⭐ نجوم فقط للتجربة
let stars = [];

for(let i=0;i<200;i++){
    stars.push({
        x: Math.random()*c.width,
        y: Math.random()*c.height,
        r: Math.random()*2,
        v: Math.random()*0.5 + 0.2
    });
}

// 🎯 رسم
function draw(){
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,c.width,c.height);

    for(let s of stars){
        s.y += s.v;
        if(s.y > c.height) s.y = 0;

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
    }

    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
