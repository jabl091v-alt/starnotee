<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarNote Galaxy 🌌</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
    color: white;
}

/* 🌌 canvas الفضاء */
canvas {
    position: fixed;
    top: 0;
    left: 0;
}

/* واجهة */
.ui {
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
}

textarea {
    width: 60%;
    height: 80px;
    border-radius: 12px;
    border: none;
    padding: 10px;
    background: rgba(255,255,255,0.1);
    color: white;
    backdrop-filter: blur(10px);
}

button {
    padding: 10px 20px;
    margin-top: 5px;
    border: none;
    background: gold;
    border-radius: 10px;
    cursor: pointer;
}

/* popup */
.popup {
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.8);
}

.popup-content {
    background:#111;
    padding:20px;
    margin:20% auto;
    width:80%;
    border-radius:15px;
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="ui">
    <h2>⭐ StarNote Galaxy</h2>
    <textarea id="note"></textarea><br>
    <button onclick="saveNote()">إرسال</button>
</div>

<div id="popup" class="popup">
    <div class="popup-content">
        <p id="ptext"></p>
        <small id="ptime"></small><br><br>
        <button onclick="closeP()">إغلاق</button>
    </div>
</div>

<script>
// 🌌 Firebase
const firebaseConfig = {
  apiKey: "AIzaSyC4bSu52LkoUTTOY2_P3q7sQSkrus3NccA",
  authDomain: "starnote-52dab.firebaseapp.com",
  projectId: "starnote-52dab",
  storageBucket: "starnote-52dab.firebasestorage.app",
  messagingSenderId: "701812553416",
  appId: "1:701812553416:web:328c463b159a5d788617fd"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🌌 canvas setup
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let stars = [];

// ⭐ نولد مجرة حقيقية (توزيع دائري + عمق وهمي)
for(let i=0;i<200;i++){
    stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        z: Math.random()*1 + 0.2, // عمق
        vx: (Math.random()-0.5)*0.3,
        vy: (Math.random()-0.5)*0.3
    });
}

// 🎮 حركة المجرة
function animate(){
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let s of stars){
        s.x += s.vx;
        s.y += s.vy;

        // لو خرجت ترجع من جهة ثانية (wrap effect)
        if(s.x < 0) s.x = canvas.width;
        if(s.x > canvas.width) s.x = 0;
        if(s.y < 0) s.y = canvas.height;
        if(s.y > canvas.height) s.y = 0;

        let size = s.z * 3;

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(s.x, s.y, size, 0, Math.PI*2);
        ctx.fill();
    }

    requestAnimationFrame(animate);
}
animate();

// 💾 حفظ الرسالة
function saveNote(){
    let text = document.getElementById("note").value;
    if(!text) return;

    db.collection("notes").add({
        text:text,
        time:new Date().toLocaleString()
    });

    document.getElementById("note").value="";
}

// 🌟 عرض النجوم ككواكب داخل المجرة
db.collection("notes").orderBy("time","desc")
.onSnapshot(snap=>{
    for(let i=0;i<stars.length;i++){
        stars[i].note = null;
    }

    let i=0;
    snap.forEach(doc=>{
        if(i < stars.length){
            stars[i].note = doc.data();
            i++;
        }
    });
});

// 👆 ضغط على النجمة (تقريب لمس)
canvas.addEventListener("click",(e)=>{
    let mx = e.clientX;
    let my = e.clientY;

    for(let s of stars){
        let dx = mx - s.x;
        let dy = my - s.y;
        if(Math.sqrt(dx*dx+dy*dy) < 10 && s.note){
            open(s.note);
        }
    }
});

function open(note){
    document.getElementById("popup").style.
        display="block";
    document.getElementById("ptext").innerText="⭐ "+note.text;
    document.getElementById("ptime").innerText="📅 "+note.time;
}

function closeP(){
    document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
