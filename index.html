<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarNote Galaxy Pro 🌌</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #000010, #000000);
    font-family: Arial;
    color: white;
}

/* canvas */
canvas {
    position: fixed;
    top: 0;
    left: 0;
}

/* UI */
.ui {
    position: fixed;
    top: 15px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

textarea {
    width: 60%;
    height: 80px;
    border-radius: 12px;
    border: none;
    padding: 10px;
    background: rgba(255,255,255,0.08);
    color: white;
    backdrop-filter: blur(8px);
}

button {
    padding: 10px 20px;
    margin-top: 5px;
    border: none;
    background: gold;
    border-radius: 10px;
    cursor: pointer;
}

/* popup */
.popup {
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.85);
}

.popup-content {
    background:#111;
    padding:20px;
    margin:20% auto;
    width:80%;
    border-radius:15px;
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="ui">
    <h2>⭐ StarNote Galaxy Pro</h2>
    <textarea id="note" placeholder="اكتب رسالتك..."></textarea><br>
    <button onclick="saveNote()">إرسال</button>
</div>

<div id="popup" class="popup">
    <div class="popup-content">
        <p id="ptext"></p>
        <small id="ptime"></small><br><br>
        <button onclick="closeP()">إغلاق</button>
    </div>
</div>

<script>
// 🔥 Firebase
const firebaseConfig = {
  apiKey: "AIzaSyC4bSu52LkoUTTOY2_P3q7sQSkrus3NccA",
  authDomain: "starnote-52dab.firebaseapp.com",
  projectId: "starnote-52dab",
  storageBucket: "starnote-52dab.firebasestorage.app",
  messagingSenderId: "701812553416",
  appId: "1:701812553416:web:328c463b159a5d788617fd"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🌌 canvas
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

// 🎮 camera (Zoom + Drag)
let camera = {
    x: 0,
    y: 0,
    zoom: 1
};

let dragging = false;
let last = {x:0,y:0};

// ⭐ stars (messages)
let stars = [];

// 🌌 draw loop
function draw(){
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let s of stars){

        // تحويل حسب الكاميرا
        let x = (s.x - camera.x) * camera.zoom + canvas.width/2;
        let y = (s.y - camera.y) * camera.zoom + canvas.height/2;

        // حركة خفيفة طبيعية
        s.x += s.vx;
        s.y += s.vy;

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(x, y, 3 * camera.zoom, 0, Math.PI*2);
        ctx.fill();
    }

    requestAnimationFrame(draw);
}
draw();

// 💾 حفظ
function saveNote(){
    let text = document.getElementById("note").value;
    if(!text) return;

    db.collection("notes").add({
        text:text,
        time:new Date().toLocaleString(),
        x: Math.random()*1000,
        y: Math.random()*1000
    });

    document.getElementById("note").value="";
}

// 🌟 load
db.collection("notes").onSnapshot(snap=>{
    stars = [];
    snap.forEach(doc=>{
        stars.push(doc.data());
    });
});

// 👆 click stars
canvas.addEventListener("click",(e)=>{
    let mx = e.clientX;
    let my = e.clientY;

    for(let s of stars){
        let x = (s.x - camera.x) * camera.zoom + canvas.width/2;
        let y = (s.y - camera.y) * camera.zoom + canvas.height/2;

        let dx = mx - x;
        let dy = my - y;

        if(Math.sqrt(dx*dx+dy*dy) < 10){
            openStar(s);
        }
    }
});

// 🔍 Zoom
canvas.addEventListener("wheel",(e)=>{
    camera.zoom += e.deltaY * -0.001;
    camera.zoom = Math.min(Math.max(0.5, camera.zoom), 3);
});

// 🧭 Drag
canvas.addEventListener("mousedown",(e)=>{
    dragging = true;
    last.x = e.clientX;
    last.y = e.clientY;
});

canvas.addEventListener("mouseup",()=>dragging=false);

canvas.addEventListener("mousemove",(e)=>{
    if(dragging){
        let dx = e.clientX - last.x;
        let dy = e.clientY - last.y;

        camera.x -= dx / camera.zoom;
        camera.y -= dy / camera.zoom;

        last.x = e.clientX;
        last.y = e.clientY;
    }
});

// ⭐ popup
function openStar(s){
    document.getElementById("popup").style.display="block";
    document.getElementById("ptext").innerText="⭐ "+s.text;
    document.getElementById("ptime").innerText="📅 "+s.time;
}

function closeP(){
    document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
